<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReTag Item</title>
  <style>
    :root{--green:#245b43;--dark:#193e2e;--cream:#f6f7f2;--muted:#65716a;--line:#dfe6df}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:#17201c}.wrap{width:min(560px,calc(100% - 28px));margin:0 auto;padding:45px 0}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 18px 45px rgba(32,56,39,.08)}.brand{font-weight:800;font-size:24px;color:var(--green);margin-bottom:28px}.badge{display:inline-block;padding:6px 11px;border-radius:999px;background:#e8f1e8;color:var(--green);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.7px}.icon{width:70px;height:70px;border-radius:18px;background:#e8eee5;display:grid;place-items:center;font-size:32px;margin:20px 0}h1{font-size:38px;line-height:1.1;margin:0 0 12px}p{color:var(--muted);line-height:1.6}.info{padding:18px;background:#f7f9f6;border-radius:14px;margin:22px 0}.info strong{display:block;font-size:18px;margin-bottom:4px}.info span{color:var(--muted)}.btn{width:100%;padding:15px 18px;border:0;border-radius:999px;background:var(--green);color:#fff;font-weight:700;font-size:16px;cursor:pointer}.form{display:none;margin-top:18px}.form.show{display:block}.form label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}.form input,.form textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.form textarea{min-height:120px;resize:vertical}.send{margin-top:14px}.status{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.status.show{display:block}.status.success{background:#e8f4e9;color:var(--dark)}.status.error{background:#fff0ef;color:#7c3028}.small{font-size:12px;color:var(--muted);margin-top:18px}
  </style>
</head>
<body>
  <div class="wrap"><div class="card">
    <div class="brand">↻ ReTag</div>
    <span class="badge" id="badge">ReTag ID: loading...</span>
    <div class="icon" id="icon">🏷️</div>
    <h1 id="headline">You found a ReTag item.</h1>
    <p id="description">The owner of this item has registered it with ReTag. Please help return it safely.</p>
    <div class="info"><strong id="itemName">Loading item...</strong><span id="itemNote">Owner contact is protected by ReTag.</span></div>
    <button class="btn" id="contactButton" type="button">Contact the owner</button>

    <form class="form" id="contactForm">
      <label for="name">Your name (optional)</label>
      <input id="name" maxlength="80" placeholder="Your name">

      <label for="contact">How can the owner reach you? (optional)</label>
      <input id="contact" maxlength="120" placeholder="Email or phone">

      <label for="message">Message</label>
      <textarea id="message" maxlength="1000" required placeholder="I found your item. We can arrange a safe return."></textarea>

      <button class="btn send" id="sendButton" type="submit">Send message</button>
      <div class="status" id="status"></div>
    </form>

    <div class="small">No app is required. This page is opened directly from the QR code.</div>
  </div></div>

  <script>
    const SUPABASE_URL = 'https://hrfpbastnumyinvmiaqf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_tnvQHJj6rEDOKlSJLGHM-A_-Xdy2d0X';
    const params = new URLSearchParams(window.location.search);
    const code = (params.get('code') || '').trim().toUpperCase();
    const badge = document.getElementById('badge');
    const contactButton = document.getElementById('contactButton');
    const contactForm = document.getElementById('contactForm');
    const statusBox = document.getElementById('status');
    const sendButton = document.getElementById('sendButton');
    const itemName = document.getElementById('itemName');
    const itemNote = document.getElementById('itemNote');
    const icon = document.getElementById('icon');
    let itemId = null;

    function showStatus(text, type) { statusBox.textContent = text; statusBox.className = 'status show ' + type; }
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[ch])); }
    function iconForType(type) { const icons={Phone:'📱',Wallet:'👛',Keys:'🔑',Bag:'🎒',Luggage:'🧳',Pet:'🐾',Other:'🏷️'}; return icons[type] || '🏷️'; }

    async function loadItem() {
      if (!code) { badge.textContent='Invalid ReTag link'; contactButton.disabled=true; contactButton.textContent='Invalid link'; return; }
      badge.textContent = 'ReTag ID: ' + code;
      try {
        const url = `${SUPABASE_URL}/rest/v1/items?select=id,code,item_name,item_type,is_lost&code=eq.${encodeURIComponent(code)}&limit=1`;
        const response = await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
        if (!response.ok) throw new Error('Could not load item');
        const rows=await response.json();
        if (!rows.length) { itemName.textContent='ReTag ID not found'; itemNote.textContent='Please check the QR code or link.'; contactButton.disabled=true; contactButton.textContent='Item not found'; return; }
        const item=rows[0]; itemId=item.id; itemName.textContent=item.item_name || 'ReTag item'; icon.textContent=iconForType(item.item_type);
        if(item.is_lost){ itemNote.textContent='This item is marked as lost. Please help the owner recover it safely.'; } else { itemNote.textContent='Owner contact is protected by ReTag.'; }
      } catch(error) { itemName.textContent='Unable to load item'; contactButton.disabled=true; contactButton.textContent='Try again later'; }
    }

    contactButton.addEventListener('click',()=>{contactForm.classList.add('show');contactButton.style.display='none';document.getElementById('message').focus();});

    contactForm.addEventListener('submit',async(event)=>{
      event.preventDefault(); if(!itemId)return;
      const name=document.getElementById('name').value.trim(); const contact=document.getElementById('contact').value.trim(); const message=document.getElementById('message').value.trim();
      if(!message){showStatus('Please enter a message.','error');return;}
      sendButton.disabled=true;sendButton.textContent='Sending...';
      try{
        const response=await fetch(`${SUPABASE_URL}/rest/v1/messages`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({item_id:itemId,finder_name:name||null,finder_contact:contact||null,finder_message:message})});
        if(!response.ok)throw new Error('Message could not be sent');
        contactForm.reset();showStatus('Message sent successfully. Thank you for helping return the item.','success');sendButton.textContent='Message sent';
      }catch(error){showStatus('We could not send the message. Please try again.','error');sendButton.disabled=false;sendButton.textContent='Send message';}
    });
    loadItem();
  </script>
</body>
</html>
